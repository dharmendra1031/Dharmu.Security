name: build

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore Dharmu.Security.slnx

      - name: Build solution
        run: dotnet build Dharmu.Security.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Dharmu.Security.Tests/Dharmu.Security.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          dotnet pack src/Dharmu.Security.Core/Dharmu.Security.Core.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Dharmu.Security.Windows/Dharmu.Security.Windows.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package consumption
        shell: pwsh
        run: |
          $projectDir = Join-Path $env:RUNNER_TEMP 'DharmuPackageSmoke'
          New-Item -ItemType Directory -Path $projectDir -Force | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Dharmu.Security.AspNetCore" Version="0.1.0" />
            </ItemGroup>
          </Project>
          '@ | Set-Content (Join-Path $projectDir 'DharmuPackageSmoke.csproj')
          @'
          using Dharmu.Security.AspNetCore;

          var builder = WebApplication.CreateBuilder(args);
          builder.Services.AddDharmuSecurity(options =>
          {
              options.ProductCode = "SMOKE";
              options.TrustedPublicKeys["primary"] = "verification-key-for-compile-test";
          });

          var app = builder.Build();
          app.UseDharmuLicenseProtection();
          app.MapDharmuSecurityEndpoints();
          app.Run();
          '@ | Set-Content (Join-Path $projectDir 'Program.cs')

          $project = Join-Path $projectDir 'DharmuPackageSmoke.csproj'
          $packages = Join-Path $PWD 'artifacts'
          $config = Join-Path $projectDir 'NuGet.Config'
          @"
          <configuration>
            <packageSources>
              <clear />
              <add key="packages" value="$packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content $config

          dotnet restore $project --configfile $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: dharmu-security-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

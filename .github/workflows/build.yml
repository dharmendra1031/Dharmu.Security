name: build

on:
  workflow_call:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore Dharmu.Security.slnx

      - name: Build solution
        run: dotnet build Dharmu.Security.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Dharmu.Security.Tests/Dharmu.Security.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=detailed"

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          dotnet pack src/Dharmu.Security.Core/Dharmu.Security.Core.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Dharmu.Security.Windows/Dharmu.Security.Windows.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime-only package contents
        shell: pwsh
        run: |
          $expected = @('Dharmu.Security.Core', 'Dharmu.Security.Windows', 'Dharmu.Security.AspNetCore')
          $packages = @(Get-ChildItem artifacts/*.nupkg)
          if ($packages.Count -ne $expected.Count) { throw 'Unexpected package count.' }
          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $manifest = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
              if ($manifest.Count -ne 1) { throw 'Missing or ambiguous package manifest.' }
              $reader = [System.IO.StreamReader]::new($manifest[0].Open())
              try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $id = [string]$nuspec.package.metadata.id
              if ($id -notin $expected) { throw "Unexpected package: $id" }
              $expected = @($expected | Where-Object { $_ -ne $id })
              if ($archive.Entries.FullName -match 'LicenseTool|LicenseIssuer|DeviceTool|SecretTool|\.pfx$|\.p12$|\.key$|\.lic$|\.pem$') {
                throw "Private or provisioning content in runtime package: $id"
              }
              if ($nuspec.SelectNodes("//*[local-name()='dependency']") | Where-Object { $_.id -match 'LicenseTool|DeviceTool|SecretTool' }) {
                throw "Owner or provisioning dependency in runtime package: $id"
              }
            } finally { $archive.Dispose() }
          }
          if ($expected.Count -ne 0) { throw 'A runtime package is missing.' }

      - name: Verify package consumption
        shell: pwsh
        run: |
          $projectDir = Join-Path $env:RUNNER_TEMP 'DharmuPackageSmoke'
          New-Item -ItemType Directory -Path $projectDir -Force | Out-Null
          $projectXml = @'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Dharmu.Security.AspNetCore" Version="PACKAGE_VERSION" />
            </ItemGroup>
          </Project>
          '@
          $version = ([xml](Get-Content -Raw 'src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj')).Project.PropertyGroup.Version
          $projectXml.Replace('PACKAGE_VERSION', $version) | Set-Content (Join-Path $projectDir 'DharmuPackageSmoke.csproj')
          Copy-Item 'tests/PackageSmoke/Program.cs' (Join-Path $projectDir 'Program.cs')

          $project = Join-Path $projectDir 'DharmuPackageSmoke.csproj'
          $packages = Join-Path $PWD 'artifacts'
          $config = Join-Path $projectDir 'NuGet.Config'
          @"
          <configuration>
            <packageSources>
              <clear />
              <add key="packages" value="$packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="packages">
                <package pattern="Dharmu.Security.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          "@ | Set-Content $config

          $env:NUGET_PACKAGES = Join-Path $projectDir 'packages'
          dotnet restore $project --configfile $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:DHARMU_SMOKE_DEVICE_TOOL = (Resolve-Path 'src/Dharmu.Security.DeviceTool/bin/Release/net10.0-windows/Dharmu.Security.DeviceTool.dll').Path
          $env:DHARMU_SMOKE_LICENSE_TOOL = (Resolve-Path 'src/Dharmu.Security.LicenseTool/bin/Release/net10.0-windows/Dharmu.Security.LicenseTool.dll').Path
          dotnet run --project $project --configuration Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: dharmu-security-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

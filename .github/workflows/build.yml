name: build

on:
  workflow_call:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore Dharmu.Security.slnx

      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $output = dotnet list Dharmu.Security.slnx package --vulnerable --include-transitive --format json --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit failed.' }
          $report = ($output -join "`n") | ConvertFrom-Json -ErrorAction Stop
          if ($report.version -ne 1 -or $null -eq $report.projects) {
            throw 'Unexpected NuGet audit report format.'
          }
          $findings = @(
            foreach ($project in $report.projects) {
              foreach ($framework in $project.frameworks) {
                foreach ($package in (@($framework.topLevelPackages) + @($framework.transitivePackages))) {
                  foreach ($vulnerability in $package.vulnerabilities) {
                    if ($null -ne $vulnerability) {
                      [pscustomobject]@{
                        Package = $package.id
                        Version = $package.resolvedVersion
                        Severity = $vulnerability.severity
                        Advisory = $vulnerability.advisoryurl
                      }
                    }
                  }
                }
              }
            }
          )
          if ($findings.Count -gt 0) {
            $findings | Sort-Object Package, Version, Advisory -Unique | Format-Table -AutoSize
            throw 'Known vulnerable dependencies detected. Review and update before release.'
          }
          Write-Host 'NUGET_AUDIT PASS: no known vulnerable direct or transitive packages reported.'

      - name: Build solution
        run: dotnet build Dharmu.Security.slnx --configuration Release --no-restore

      - name: Provision test device and secret key
        run: dotnet run --project src/Dharmu.Security.DeviceTool --configuration Release --no-build --no-restore

      - name: Test
        run: dotnet test tests/Dharmu.Security.Tests/Dharmu.Security.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=detailed"

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          dotnet pack src/Dharmu.Security.Core/Dharmu.Security.Core.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Dharmu.Security.Windows/Dharmu.Security.Windows.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime-only package contents
        shell: pwsh
        run: |
          $expected = @('Dharmu.Security.Core', 'Dharmu.Security.Windows', 'Dharmu.Security.AspNetCore')
          $packages = @(Get-ChildItem artifacts/*.nupkg)
          if ($packages.Count -ne $expected.Count) { throw 'Unexpected package count.' }
          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $manifest = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
              if ($manifest.Count -ne 1) { throw 'Missing or ambiguous package manifest.' }
              $reader = [System.IO.StreamReader]::new($manifest[0].Open())
              try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $id = [string]$nuspec.package.metadata.id
              if ($id -notin $expected) { throw "Unexpected package: $id" }
              $expected = @($expected | Where-Object { $_ -ne $id })
              if ($archive.Entries.FullName -match 'LicenseTool|LicenseIssuer|DeviceTool|SecretTool|\.pfx$|\.p12$|\.key$|\.lic$|\.pem$') {
                throw "Private or provisioning content in runtime package: $id"
              }
              if ($nuspec.SelectNodes("//*[local-name()='dependency']") | Where-Object { $_.id -match 'LicenseTool|DeviceTool|SecretTool' }) {
                throw "Owner or provisioning dependency in runtime package: $id"
              }
            } finally { $archive.Dispose() }
          }
          if ($expected.Count -ne 0) { throw 'A runtime package is missing.' }

      - name: Verify package consumption
        shell: pwsh
        run: |
          $env:DHARMU_SMOKE_COPY_OUTPUT = Join-Path $env:RUNNER_TEMP 'DharmuCopyFixture'
          ./tests/PackageSmoke/Run.ps1

      - name: Upload cross-machine test fixture
        uses: actions/upload-artifact@v4
        with:
          name: dharmu-copy-test-fixture
          path: ${{ runner.temp }}/DharmuCopyFixture/
          retention-days: 1
          if-no-files-found: error

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: dharmu-security-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  cross-machine:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: dharmu-security-packages
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: dharmu-copy-test-fixture
          path: ${{ runner.temp }}/DharmuCopyFixture
      - name: Build client provisioning tool
        run: dotnet build src/Dharmu.Security.DeviceTool/Dharmu.Security.DeviceTool.csproj --configuration Release
      - name: Reject copied license and DPAPI data on independent Windows runner
        shell: pwsh
        run: |
          $env:DHARMU_SMOKE_COPY_INPUT = Join-Path $env:RUNNER_TEMP 'DharmuCopyFixture'
          ./tests/PackageSmoke/Run.ps1

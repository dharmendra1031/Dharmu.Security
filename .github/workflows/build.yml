name: build

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore security package
        run: dotnet restore src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj

      - name: Build security package
        run: dotnet build src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj --configuration Release --no-restore

      - name: Restore device tool
        run: dotnet restore src/Dharmu.Security.DeviceTool/Dharmu.Security.DeviceTool.csproj

      - name: Build device tool
        run: dotnet build src/Dharmu.Security.DeviceTool/Dharmu.Security.DeviceTool.csproj --configuration Release --no-restore

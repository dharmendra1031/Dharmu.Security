name: publish-packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'security-v*'

permissions:
  contents: read

jobs:
  check-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/security-v(\d+\.\d+\.\d+)$') {
            throw 'Publishing requires a stable security-vX.Y.Z tag.'
          }
          $version = $Matches[1]
          foreach ($project in @(
            'src/Dharmu.Security.Core/Dharmu.Security.Core.csproj',
            'src/Dharmu.Security.Windows/Dharmu.Security.Windows.csproj',
            'src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj'
          )) {
            $packageVersion = ([xml](Get-Content -Raw $project)).Project.PropertyGroup.Version
            if ($packageVersion -ne $version) { throw "Package version $packageVersion does not match tag in $project" }
          }

  verify:
    needs: check-version
    uses: ./.github/workflows/build.yml

  publish:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: dharmu-security-packages
          path: artifacts

      - name: Publish verified packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = @(Get-ChildItem artifacts/*.nupkg)
          if ($packages.Count -ne 3) { throw 'Expected exactly three verified runtime packages.' }
          dotnet nuget push 'artifacts/*.nupkg' --source 'https://nuget.pkg.github.com/dharmendra1031/index.json' --api-key $env:NUGET_AUTH_TOKEN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

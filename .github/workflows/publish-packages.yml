name: publish-packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'security-v*'
    branches:
      - development
    paths:
      - '.github/workflows/publish-packages.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check package version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not $tag.StartsWith('security-v')) { throw 'Publishing requires a security-v* tag.' }
          $version = $tag.Substring(10)
          foreach ($project in @(
            'src/Dharmu.Security.Core/Dharmu.Security.Core.csproj',
            'src/Dharmu.Security.Windows/Dharmu.Security.Windows.csproj',
            'src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj'
          )) {
            $packageVersion = ([xml](Get-Content $project)).Project.PropertyGroup.Version
            if ($packageVersion -ne $version) { throw "Package version $packageVersion does not match tag $tag in $project" }
          }

      - name: Restore
        run: dotnet restore Dharmu.Security.slnx

      - name: Build
        run: dotnet build Dharmu.Security.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Dharmu.Security.Tests/Dharmu.Security.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack Core
        run: dotnet pack src/Dharmu.Security.Core/Dharmu.Security.Core.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Pack Windows
        run: dotnet pack src/Dharmu.Security.Windows/Dharmu.Security.Windows.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Pack ASP.NET Core
        run: dotnet pack src/Dharmu.Security.AspNetCore/Dharmu.Security.AspNetCore.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Publish
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/dharmendra1031/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
